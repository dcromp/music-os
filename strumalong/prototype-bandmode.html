<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Mode Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE, throwaway (#71). UI shapes for Band mode's guided song builder, switched with #D / #A / #B / #C
     and the floating bar. D (round 2) is B's timeline with A's step guidance, the founder's pick from round 1.
     Fake data and simple synthesized sound; nothing is saved. Never deploy. -->
<style>
/* Layout concept: a phone-first song builder in Strum Along's palette; the song (sections and their colours)
   is the one constant across the three shapes, which disagree about where the guidance lives. */
:root {
  --bg: #f4f1e8; --text: #222b27; --muted: #5d6a62; --accent: #22543e; --on-accent: #ffffff;
  --panel: #ffffff; --border: #d4d8cc; --soft: #e9eee6; --warn-bg: #fff0d2; --warn-text: #744900;
  --verse: #3f7d5c; --pre: #b07a1e; --chorus: #2f5f9e; --bridge: #8a4f8f; --solo: #b3472f; --on-sec: #ffffff;
  --bar-bg: #1f2622; --bar-text: #f4f1e8;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --text: #e6ebe5; --muted: #a0ada5; --accent: #7cc4a0; --on-accent: #0c1310;
  --panel: #1b2320; --border: #34413a; --soft: #25302a; --warn-bg: #3a2f13; --warn-text: #f1cf8a;
  --verse: #5fae86; --pre: #d9a54a; --chorus: #6f9fe0; --bridge: #c08ac5; --solo: #e8846c; --on-sec: #0c1310;
  --bar-bg: #e6ebe5; --bar-text: #121815; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121815; --text: #e6ebe5; --muted: #a0ada5; --accent: #7cc4a0; --on-accent: #0c1310;
  --panel: #1b2320; --border: #34413a; --soft: #25302a; --warn-bg: #3a2f13; --warn-text: #f1cf8a;
  --verse: #5fae86; --pre: #d9a54a; --chorus: #6f9fe0; --bridge: #c08ac5; --solo: #e8846c; --on-sec: #0c1310;
  --bar-bg: #e6ebe5; --bar-text: #121815; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px; }
#app { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 12px; }
.stack > *, .A-body > *, .C-open > * { min-width: 0; } /* scrolling rows (suggestions) must not widen their column */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--on-sec); }
.sec-verse { background: var(--verse); } .sec-pre { background: var(--pre); } .sec-chorus { background: var(--chorus); } .sec-bridge { background: var(--bridge); } .sec-solo { background: var(--solo); }
.soon { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn-text); padding: 2px 7px; border-radius: 6px; }
.fake { font-size: 12px; color: var(--muted); font-style: italic; }

/* shared editors */
.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { min-height: 52px; border-radius: 10px; border: 1px dashed var(--border); background: var(--soft); font-size: 18px; font-weight: 700; display: grid; place-items: center; }
.slot.filled { border-style: solid; background: var(--panel); }
.slot.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.slot small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
.palette { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.palette button { min-height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-weight: 700; }
.palette button small { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
.sugg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sugg button { flex: none; text-align: left; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); min-height: 44px; }
.sugg button b { display: block; font-size: 14px; }
.sugg button span { font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 12px; border: 0; background: var(--panel); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 10px; height: 16px; border-radius: 3px; background: var(--border); display: inline-block; }
.meter i.on { background: var(--accent); }

/* solo scales */
.scales { display: grid; gap: 8px; }
.scale { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--panel); text-align: left; }
.scale.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.scale .notes { font-family: var(--font-num); font-size: 13px; letter-spacing: .02em; }
.fret { width: 100%; max-width: 320px; height: auto; display: block; }
.fret .str { stroke: var(--muted); stroke-width: 1; }
.fret .fw { stroke: var(--border); stroke-width: 2; }
.fret .nut { stroke: var(--text); stroke-width: 4; }
.fret .dot { fill: var(--panel); stroke: var(--text); stroke-width: 1.5; }
.fret .root { fill: var(--solo); stroke: var(--solo); }
.fret text { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }

/* mini song strip (shared) */
.strip { display: flex; gap: 3px; height: 34px; align-items: stretch; position: relative; }
.strip .blk { border-radius: 6px; color: var(--on-sec); font-size: 11px; font-weight: 700; display: grid; place-items: center; overflow: hidden; white-space: nowrap; min-width: 0; }
.strip .blk.empty { opacity: .45; }
.playhead { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); pointer-events: none; }

/* ---------------- Variant A: step-by-step wizard */
.A-top { display: grid; gap: 10px; }
.A-steps { display: flex; gap: 4px; }
.A-steps button { flex: 1; height: 6px; border-radius: 3px; border: 0; background: var(--border); padding: 0; min-height: 0; }
.A-steps button.done { background: var(--accent); opacity: .5; } .A-steps button.cur { background: var(--accent); }
.A-body { margin-top: 14px; display: grid; gap: 14px; }
.A-nav { position: sticky; bottom: 64px; display: flex; gap: 8px; margin-top: 18px; }
.A-nav .btn { flex: 1; }
.A-dock { margin-top: 16px; display: grid; gap: 6px; }
.A-big { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tile { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); display: grid; gap: 6px; min-height: 44px; }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.tile .order { display: flex; gap: 2px; flex-wrap: wrap; }
.tile .order i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }

/* ---------------- Variant B: timeline first + coach */
.B { display: grid; gap: 10px; }
.B-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.B-tl { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
.B-grid { display: grid; grid-template-columns: 74px 1fr; min-width: 640px; }
.B-lane-name { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; align-items: center; background: var(--soft); }
.B-lane { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--border); position: relative; min-height: 44px; }
.B-cell { border-radius: 6px; border: 0; padding: 4px 6px; text-align: left; font-size: 12px; overflow: hidden; white-space: nowrap; min-width: 0; }
.B-cell.sec { color: var(--on-sec); font-weight: 700; }
.B-cell.part { background: var(--soft); color: var(--text); }
.B-cell.part.empty { background: transparent; border: 1px dashed var(--border); color: var(--muted); }
.B-cell.locked { background: transparent; border: 1px dashed var(--border); color: var(--muted); opacity: .7; }
.B-cell.sel { box-shadow: inset 0 0 0 2px var(--text); }
.B-coach { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--bar-bg); color: var(--bar-text); }
.B-coach .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; font-weight: 700; }
.B-coach .btn { background: transparent; color: var(--bar-text); border-color: currentColor; min-height: 38px; }
.B-sheet { border-top: 3px solid var(--accent); }
.B-rotate { display: none; }
@media (orientation: portrait) and (max-width: 600px) { .B-rotate { display: block; } }

/* ---------------- Variant C: section cards */
.C { display: grid; gap: 14px; }
.C-order { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; align-items: center; }
.C-order .chip { flex: none; min-height: 34px; padding: 0 10px; border: 0; }
.C-order .add { flex: none; min-height: 34px; border-radius: 999px; border: 1px dashed var(--border); background: transparent; padding: 0 10px; color: var(--muted); }
.C-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.C-card { border-radius: 16px; border: 1px solid var(--border); background: var(--panel); overflow: hidden; }
.C-card header { padding: 12px 14px; color: var(--on-sec); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.C-card header p { font-size: 12px; opacity: .9; }
.C-card .rows { display: grid; }
.C-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: center; text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; min-height: 48px; }
.C-row .what { font-size: 12px; font-weight: 600; color: var(--muted); }
.C-open { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--soft); display: grid; gap: 10px; }

/* ---------------- Variant D: B's timeline with A's step guidance (founder's pick, round 1) */
.D { display: grid; gap: 10px; }
.D-steps { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.D-steps button { flex: none; min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; white-space: nowrap; }
.D-steps button.cur { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.D-steps button.done { color: var(--muted); }
.D-steps button.soonstep { border-style: dashed; color: var(--muted); }
.D-guide { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--bar-bg); color: var(--bar-text); }
.D-guide .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; font-weight: 700; }
.D-guide .btn { background: transparent; color: var(--bar-text); border-color: currentColor; min-height: 38px; }
.D-guide .btn.primary { background: var(--bar-text); color: var(--bar-bg); border-color: var(--bar-text); }
.D-main { display: grid; gap: 10px; align-items: start; }
@media (orientation: landscape) and (min-width: 700px) { .D-main { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); } }
.B > *, .D > *, .D-main > * { min-width: 0; } /* the wide timeline scrolls inside its box instead of widening the page */
@media (orientation: landscape) and (max-height: 500px) {
  .D-guide { grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 8px 12px; gap: 4px 12px; }
  .D-guide .who { grid-column: 1 / -1; }
  .D-guide p { font-size: 13px; }
  .D-guide .row { flex-wrap: nowrap; }
}
.D .B-lane.dim, .D .B-lane-name.dim { opacity: .35; }
.D .B-lane-name.lit { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.D .B-cell.cur { box-shadow: inset 0 0 0 2px var(--text); }

/* recording and tone (round 3) */
.rec-setup .check { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--border); }
.rec-setup .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.rec-setup .check.ok .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tuner { font-family: var(--font-num); font-size: 13px; } .tuner span { color: var(--accent); letter-spacing: .1em; }
.meter-h { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; } .meter-h i { display: block; height: 100%; background: var(--verse); transition: width .1s; }
.rec-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.rec-btn { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--solo); background: var(--panel); color: var(--solo); font-size: 26px; line-height: 1; }
.rec-btn.on { background: var(--solo); color: var(--on-sec); }
.rec-lane { position: relative; border: 1px solid var(--border); border-radius: 10px; background: var(--soft); overflow: hidden; }
.rec-lane canvas { display: block; width: 100%; height: 70px; }
.rec-lbl { position: absolute; left: 8px; top: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }
.takes { display: grid; gap: 4px; } .take { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); }
.take.kept { border-color: var(--accent); }
.ok-note { color: var(--accent); }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pedal { min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font-size: 13px; }
.pedal.on { border-style: solid; border-color: var(--accent); background: var(--panel); color: var(--text); font-weight: 600; }
.pedal.amp.on { background: var(--accent); color: var(--on-accent); }
.arrow { color: var(--muted); font-size: 12px; }
.knobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.knob { display: grid; gap: 4px; justify-items: start; } .kbar { width: 100%; height: 6px; border-radius: 3px; background: var(--soft); } .kbar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.sugg button.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.linkbtn { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; font: inherit; min-height: 0; }
.B-cell.has-take { font-weight: 600; }

/* floating prototype switcher: not part of the design */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.switcher button { min-width: 44px; min-height: 40px; border-radius: 999px; border: 0; background: #2a2a2a; color: #fff; font-size: 18px; }
.switcher span { padding: 0 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.playbtn { min-width: 44px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app"></div>
<div class="switcher" role="navigation" aria-label="Prototype variants">
  <button type="button" id="sw-prev" aria-label="Previous variant">‹</button>
  <span id="sw-label">A</span>
  <button type="button" id="sw-next" aria-label="Next variant">›</button>
</div>

<script>
"use strict";
// ============================================================ shared song model (fake data, in memory only)
const KEYS = {
  C: ["C", "Dm", "Em", "F", "G", "Am"], G: ["G", "Am", "Bm", "C", "D", "Em"], D: ["D", "Em", "F#m", "G", "A", "Bm"],

const PROGS = [

];
const FEELS = ["Rock", "Pop", "Ballad", "Shuffle"];
const SHAPES = [
  { id: "vc", name: "Verse–chorus", desc: "The usual pop and rock shape. The chorus repeats the big idea.", order: ["verse", "chorus", "verse", "chorus", "bridge", "chorus"] },
  { id: "vpc", name: "With a pre-chorus", desc: "A short build-up lifts each chorus.", order: ["verse", "pre", "chorus", "verse", "pre", "chorus", "bridge", "chorus"] },
  { id: "aaba", name: "AABA", desc: "Verses carry the song; a middle section brings contrast.", order: ["verse", "verse", "bridge", "verse"] },
  { id: "vcs", name: "Verse–chorus with a solo", desc: "Room for your guitar: a solo before the last chorus.", order: ["verse", "chorus", "verse", "chorus", "solo", "chorus"] },

  { id: "minpent", name: "Minor pentatonic", iv: [0, 3, 5, 7, 10], use: "Bluesy and gritty, the classic rock box. Clashes on purpose; bend the minor third up towards the major." },

const DRUM_TRACKS = [

// The "AI drummer" (style and controls, #68 Q4): it picks a part per section from the feel and the section's job.
function aiDrums(feel, kind) {
  const busy = { verse: 1, pre: 2, chorus: 3, bridge: 1, solo: 2 }[kind] || 2;
  const loud = { verse: 2, pre: 2, chorus: 3, bridge: 1, solo: 3 }[kind] || 2;
  const style = kind === "bridge" && feel !== "Ballad" ? "Half-time" : feel;
  return { style, busy, loud, fill: kind !== "bridge" };
}
const BASS = [
  { id: "root", name: "Roots", desc: "One note a beat, the chord's root" },
  { id: "fifth", name: "Root–fifth", desc: "Root, then the fifth" },
  { id: "pulse", name: "Driving eighths", desc: "Pumping eighth notes" },
  { id: "walk", name: "Walking", desc: "Steps towards the next chord" },
];
const STEPS = [
  { id: "setup", name: "Set up" }, { id: "structure", name: "Structure" }, { id: "chords", name: "Chords" },
  { id: "band", name: "Drums and bass" }, { id: "lyrics", name: "Lyrics", soon: true }, { id: "melody", name: "Melody and singer", soon: true },
  { id: "guitar", name: "Lead guitar" }, { id: "mix", name: "Mix and share", soon: true },
];
const SOON = {
  lyrics: "Section by section, with a title and hook first, each section's job, syllable and rhyme checks, and AI line ideas on request. You write; the AI suggests.",
  melody: "Sing or hum a guide melody. An AI voice can re-sing it. Typed notes-and-lyrics singing is still limited (see the singing research).",

function newBlock(kind) { return { bars: [null, null, null, null], drums: { mode: "ai", track: "rock8", over: null }, bass: "root", scale: kind === "solo" ? "majpent" : null }; }
const TONES_ON = id => TONES[id].on.slice();
function sampleSong() {
  const s = { title: "Untitled song", key: "G", tempo: 100, feel: "Rock", shape: "vc", order: SHAPES[0].order.slice(), blocks: {}, takes: {}, lead: {}, tone: { rhythm: "crunch", lead: "lead" }, chain: { rhythm: ["tuner", "drive", "reverb", "amp"], lead: ["tuner", "drive", "delay", "reverb", "amp"] } }; // = TONES crunch / lead
  for (const k of Object.keys(BLOCKS)) s.blocks[k] = newBlock(k);
  s.blocks.verse.bars = ["G", "D", "Em", "C"]; // example: the verse is written, the rest is not (yet)
  return s;
}
let song = sampleSong();
const ui = { step: 0, block: "verse", slot: 0, listening: false, sel: null, open: null, coachSkip: 0, introSeen: {}, gtab: { rhythm: "chords", lead: "play" }, checks: {}, rec: null, click: true, detect: false, detected: null };

const kindsInSong = () => [...new Set(song.order)];
const filledBars = k => song.blocks[k].bars.filter(Boolean).length;
const drumsFor = k => {
  const d = song.blocks[k].drums;
  if (d.over) return d.over;
  if (d.mode === "track") { const t = DRUM_TRACKS.find(x => x.id === d.track); return { style: t.style, busy: t.busy, loud: 2, fill: true }; }
  return aiDrums(song.feel, k);
};
function setShape(id) { const sh = SHAPES.find(s => s.id === id); song.shape = id; song.order = sh.order.slice(); }
function setKey(key) {
  // keep the chords' functions when the key changes
  const old = KEYS[song.key], neu = KEYS[key];
  for (const b of Object.values(song.blocks)) b.bars = b.bars.map(c => c && old.includes(c) ? neu[old.indexOf(c)] : c);
  song.key = key;
}
function applyProg(k, deg) { song.blocks[k].bars = deg.map(d => KEYS[song.key][d]); }
function fakeListen(k) {
  ui.listening = k; render();
  setTimeout(() => { applyProg(k, PROGS[(Object.keys(BLOCKS).indexOf(k) + 1) % PROGS.length].deg); ui.listening = false; render(); }, 1800);
}

// ============================================================ simple synthesized playback
const audio = { ctx: null, master: null, playing: false, t0: 0, total: 0, raf: 0, map: [] };
const NOTE = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function chordNotes(c) { const m = /^([A-G][#b]?)(m?)/.exec(c); const r = NOTE[m[1]]; return { root: r, minor: m[2] === "m" }; }
function tone(t, freq, dur, type, gain, dest) {
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(t, dur, filter, f, gain, dest) {
  if (!noiseBuf) { noiseBuf = audio.ctx.createBuffer(1, audio.ctx.sampleRate, audio.ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = audio.ctx.createBufferSource(), fl = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
  s.buffer = noiseBuf; fl.type = filter; fl.frequency.value = f;
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
}
function kick(t, g, d) { const o = audio.ctx.createOscillator(), v = audio.ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(v); v.connect(d); o.start(t); o.stop(t + 0.32); }
function scheduleSong(onlyKind) {
  const ctx = audio.ctx, beat = 60 / song.tempo, bar = beat * 4, start = ctx.currentTime + 0.1;
  const master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination); audio.master = master;
  const order = onlyKind ? [onlyKind] : song.order;
  let t = start; audio.map = [];
  order.forEach((k, idx) => {
    const blk = song.blocks[k], dr = drumsFor(k), nextK = order[idx + 1];
    const vol = [0.45, 0.6, 0.8][dr.loud - 1] || 0.6;
    let last = null;
    audio.map.push({ idx, start: t - start, end: t - start + bar * blk.bars.length });
    blk.bars.forEach((c, bi) => {
      const chord = c || last; last = chord;
      const lastBar = bi === blk.bars.length - 1;
      if (chord) {
        const { root, minor } = chordNotes(chord);
        const base = 52 + ((root - 4 + 12) % 12); // voice around E3
        [0, minor ? 3 : 4, 7].forEach((iv, n) => tone(t + n * 0.012, hz(base + iv), bar * 0.95, "triangle", 0.05, master));
        const bassRoot = 40 + ((root - 4 + 12) % 12);
        const fifth = bassRoot + 7, third = bassRoot + (minor ? 3 : 4);
        const pat = { root: [[0, bassRoot], [1, bassRoot], [2, bassRoot], [3, bassRoot]],
          fifth: [[0, bassRoot], [2, fifth]],
          pulse: [0, .5, 1, 1.5, 2, 2.5, 3, 3.5].map(b => [b, bassRoot]),
          walk: [[0, bassRoot], [1, third], [2, fifth], [3, bassRoot + (lastBar ? -1 : 9)]] }[blk.bass];
        pat.forEach(([b, m]) => tone(t + b * beat, hz(m), blk.bass === "pulse" ? beat * 0.45 : beat * 0.9, "sawtooth", 0.06, master));
      }
      // drums: eighth-note grid per style and busyness
      const swing = dr.style === "Shuffle" ? beat / 6 : 0;
      for (let s = 0; s < 8; s++) {
        const tt = t + s * beat / 2 + (s % 2 ? swing : 0);
        const fillZone = dr.fill && lastBar && nextK && nextK !== k && s >= 4;
        if (fillZone) { noise(tt, 0.12, "bandpass", 1800, 0.5 * vol, master); if (s % 2) noise(tt + beat / 4, 0.1, "bandpass", 1500, 0.4 * vol, master); continue; }
        const half = dr.style === "Half-time" || dr.style === "Ballad";
        const kickOn = half ? s === 0 || (dr.busy > 1 && s === 5) : dr.style === "Pop" ? s % 2 === 0 : s === 0 || s === 4 || (dr.busy > 1 && s === 5) || (dr.busy > 2 && s === 3);
        const snareOn = half ? s === 4 : s === 2 || s === 6;
        const hatOn = dr.busy === 1 ? s % 2 === 0 : true;
        if (kickOn) kick(tt, 0.9 * vol, master);
        if (snareOn) noise(tt, 0.18, "bandpass", 1800, 0.55 * vol, master);
        if (hatOn) noise(tt, dr.busy > 2 && s % 2 ? 0.09 : 0.04, "highpass", 7000, 0.18 * vol, master);
      }
      t += bar;
    });
  });
  audio.t0 = start; audio.total = t - start;
}
function play(onlyKind) {
  try {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.ctx.resume();
  } catch (_) { return; }
  stop(); scheduleSong(onlyKind); audio.playing = onlyKind || true; tick(); renderPlay();
}
function stop() {
  if (audio.master) { try { audio.master.disconnect(); } catch (_) {} audio.master = null; }
  audio.playing = false; cancelAnimationFrame(audio.raf); renderPlay(); positionHeads(-1);
}
function tick() {
  const pos = audio.ctx.currentTime - audio.t0;
  if (pos > audio.total + 0.2) { stop(); return; }
  positionHeads(pos);
  audio.raf = requestAnimationFrame(tick);
}
function positionHeads(pos) {
  for (const el of document.querySelectorAll("[data-head]")) {
    if (pos < 0 || !audio.total) { el.hidden = true; continue; }
    el.hidden = false; el.style.left = Math.min(100, pos / audio.total * 100) + "%";
  }
}
function renderPlay() {
  for (const b of document.querySelectorAll('[data-act="play"]')) b.textContent = audio.playing ? "■ Stop" : b.dataset.label || "▶ Play song";
}

// ============================================================ shared editors (each variant places them differently)
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const secChip = k => `<span class="chip sec-${k}">${BLOCKS[k].name}</span>`;
const PC = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const PC_FLAT = { "D#": "Eb", "G#": "Ab", "A#": "Bb" };
const scaleNotes = sc => sc.iv.map(i => { const n = PC[(NOTE[song.key] + i) % 12]; return sc.id === "minpent" || sc.id === "mixo" ? (PC_FLAT[n] || n) : n; });
// One box position: five frets starting a fret below the key's root on the low E string. Standard tuning.
function fretboard(sc) {
  const tuning = [40, 45, 50, 55, 59, 64], rootPc = NOTE[song.key], set = new Set(sc.iv.map(i => (rootPc + i) % 12));
  let rf = (rootPc - 4 + 12) % 12; const start = Math.max(0, rf - 1), frets = 5;
  const W = 300, H = 120, x0 = 24, y0 = 12, fw = (W - x0 - 8) / frets, sh = (H - y0 - 22) / 5;
  let g = "";
  for (let f = 0; f <= frets; f++) g += `<line class="${f === 0 && start === 0 ? "nut" : "fw"}" x1="${x0 + f * fw}" y1="${y0}" x2="${x0 + f * fw}" y2="${y0 + 5 * sh}"/>`;
  for (let st = 0; st < 6; st++) g += `<line class="str" x1="${x0}" y1="${y0 + (5 - st) * sh}" x2="${x0 + frets * fw}" y2="${y0 + (5 - st) * sh}"/>`;
  for (let f = 0; f < frets; f++) g += `<text x="${x0 + (f + .5) * fw}" y="${H - 4}" text-anchor="middle">${start + f + 1}</text>`;
  for (let st = 0; st < 6; st++) for (let f = start; f <= start + frets; f++) {
    const pc = (tuning[st] + f) % 12; if (!set.has(pc)) continue;
    const x = f === start && start > 0 ? null : f === 0 ? x0 - 10 : x0 + (f - start - .5) * fw; if (x === null) continue;
    g += `<circle class="dot${pc === rootPc ? " root" : ""}" cx="${x}" cy="${y0 + (5 - st) * sh}" r="6"/>`;
  }
  return `<svg class="fret" viewBox="0 0 ${W} ${H}" role="img" aria-label="${sc.name} in ${song.key}, one position from fret ${start + 1}">${g}</svg>`;
}
function scalePanel(k, rec) {

      <div class="row" style="justify-content:space-between"><b>${song.key} ${sc.name.toLowerCase()}${sc.id === rec ? ' <span class="soon" style="background:var(--soft);color:var(--accent)">For this feel</span>' : ""}</b>

      <p class="small">${sc.use}</p><p class="notes">${scaleNotes(sc).join(" · ")}</p>${b.scale === sc.id ? fretboard(sc) : ""}</div>`).join("")}</div></div>`;
}
function hearScale(id) {
  const sc = SCALES.find(x => x.id === id);
  try { if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); audio.ctx.resume(); } catch (_) { return; }
  stop();
  const master = audio.ctx.createGain(); master.gain.value = 0.7; master.connect(audio.ctx.destination); audio.master = master;
  const base = 55 + ((NOTE[song.key] - 7 + 12) % 12), step = 60 / song.tempo / 2, t = audio.ctx.currentTime + 0.05;
  const up = sc.iv.concat([12]);

// ============================================================ Variant A: step-by-step wizard
function VariantA() {
  const st = STEPS[ui.step];
  if (!kindsInSong().includes(ui.block)) ui.block = kindsInSong()[0];
  let body = "";
  if (st.id === "setup") body = `<p class="muted">Pick a starting point. You can change all of this later.</p>${setupEditor()}`;
  else if (st.id === "structure") body = `<p class="muted">Choose a shape for your song. Each colour is a section you'll write once.</p>${structureEditor()}<details><summary class="small">Change the order</summary><div style="margin-top:8px">${orderEditor()}</div></details>`;
  else if (st.id === "chords") body = `${blockTabs("blk")}${chordEditor(ui.block)}`;
  else if (st.id === "band") body = `${blockTabs("blk")}<div class="panel"><h3>Drums · ${BLOCKS[ui.block].name}</h3><div style="margin-top:10px">${drumEditor(ui.block)}</div></div><div class="panel"><h3>Bass · ${BLOCKS[ui.block].name}</h3><div style="margin-top:10px">${bassEditor(ui.block)}</div></div>`;
  else body = soonPanel(st.id);
  return `<section aria-label="Step by step">
    <div class="A-top">
      <div class="row" style="justify-content:space-between"><p class="label">Step ${ui.step + 1} of ${STEPS.length}</p><p class="small muted">${esc(song.title)} · ${song.key} · ${song.tempo} bpm</p></div>
      <div class="A-steps">${STEPS.map((s, i) => `<button type="button" data-act="goto" data-v="${i}" class="${i < ui.step ? "done" : i === ui.step ? "cur" : ""}" aria-label="${s.name}"></button>`).join("")}</div>
      <h1 class="A-big">${st.name}${st.soon ? ' <span class="soon">Later</span>' : ""}</h1>
    </div>
    <div class="A-body">${body}</div>
    <div class="A-dock panel"><div class="row" style="justify-content:space-between"><p class="label">Your song so far</p><button type="button" class="btn small playbtn" data-act="play" data-label="▶ Play song">▶ Play song</button></div>${strip()}</div>
    <div class="A-nav"><button type="button" class="btn" data-act="back" ${ui.step === 0 ? "disabled" : ""}>Back</button><button type="button" class="btn primary" data-act="next" ${ui.step === STEPS.length - 1 ? "disabled" : ""}>Next: ${STEPS[ui.step + 1] ? STEPS[ui.step + 1].name : "Done"}</button></div>
  </section>`;
}

// ============================================================ Variant B: timeline first, with a coach

  else editor = soonPanel(st.id);
  const todo = st.id === "chords" ? kindsInSong().filter(k => filledBars(k) < 4 || !takesOf("rhythm", k).length).map(k => BLOCKS[k].name) : [];
  const introOpen = !ui.introSeen[st.id];
  return `<section class="D" aria-label="Timeline with steps">
    <div class="B-head"><div><h1>${esc(song.title)}</h1><p class="small muted">${song.key} · ${song.tempo} bpm · ${song.feel}</p></div>
      <button type="button" class="btn primary playbtn" data-act="play" data-label="▶ Play song">▶ Play song</button></div>
    <nav class="D-steps" aria-label="Band members">${STEPS.map((s, i) => `<button type="button" data-act="goto" data-v="${i}" class="${i === ui.step ? "cur" : stepDone(s.id) ? "done" : s.soon ? "soonstep" : ""}"${i === ui.step ? ' aria-current="step"' : ""}>${i + 1}. ${MEMBERS[s.id].who}${stepDone(s.id) && i !== ui.step ? " ✓" : ""}</button>`).join("")}</nav>
    <div class="D-guide" role="status"><span class="who">Step ${ui.step + 1} of ${STEPS.length} · ${m.who}${st.soon ? " · later prototype" : ""}</span>
      ${introOpen ? `<p>${m.intro}</p>${m.tryThis ? `<p class="small"><b>Try this:</b> ${m.tryThis}</p>` : ""}` : `<p class="small">${m.who}. <button type="button" class="linkbtn" data-act="intro" data-v="${st.id}">What do I do here?</button></p>`}
      ${todo.length ? `<p class="small">Still to do: ${todo.join(", ")} (chords and a take).</p>` : ""}
      <div class="row">${introOpen && m.tryThis ? `<button type="button" class="btn" data-act="intro" data-v="${st.id}">Got it</button>` : ""}<button type="button" class="btn" data-act="back" ${ui.step === 0 ? "disabled" : ""}>Back</button><button type="button" class="btn primary" data-act="next" ${ui.step === STEPS.length - 1 ? "disabled" : ""}>Next: ${STEPS[ui.step + 1] ? MEMBERS[STEPS[ui.step + 1].id].who : "Done"}</button></div></div>
    <p class="B-rotate small muted">Tip: turn your phone sideways to see the timeline and the step side by side.</p>
    <div class="D-main">
      <div class="B-tl"><div class="B-grid">
        ${lanes.map(([name, lane]) => `<div class="B-lane-name${dim(lane)}">${name}</div><div class="B-lane${dim(lane)}">${song.order.map((k, i) => cell(k, i, lane)).join("")}${lane === "sec" ? '<div class="playhead" data-head hidden></div>' : ""}</div>`).join("")}
      </div></div>
      <div class="panel stack B-sheet">${editor}</div>
    </div>
  </section>`;
}

// ---- fake recording: count-in and click are real; the take is pretend
function startRec(role, k) {
  stop();
  try { if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); audio.ctx.resume(); } catch (_) { return; }
  const beat = 60 / song.tempo, bars = song.blocks[k].bars.length, total = 4 + bars * 4;
  ui.rec = { role, k, n: 0 };
  render();
  const canvas = document.getElementById("rec-canvas"), g = canvas && canvas.getContext("2d");
  const color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#22543e";
  if (g) g.clearRect(0, 0, canvas.width, canvas.height);
  const tickBeat = () => {
    if (!ui.rec) return;
    const n = ui.rec.n++;
    if (ui.click || n < 4) tone(audio.ctx.currentTime + 0.01, n % 4 === 0 ? 1600 : 1000, 0.05, "square", 0.08, audio.ctx.destination);
    const status = document.getElementById("rec-status"), meter = document.getElementById("rec-meter");
    if (n < 4) { if (status) status.textContent = `Count-in: ${n + 1}`; }
    else {
      const b = n - 4;
      if (status) status.textContent = `Recording · bar ${Math.floor(b / 4) + 1} of ${bars}`;
      if (meter) meter.style.width = (45 + Math.random() * 35) + "%";
      if (g) { g.fillStyle = color; const x0 = b / (bars * 4) * canvas.width, w = canvas.width / (bars * 4);
        for (let x = 0; x < w; x += 3) { const a = (b % 2 ? 0.9 : 0.6) * Math.exp(-x / w * 1.6) * (0.5 + Math.random() * 0.5) * 32; g.fillRect(x0 + x, 35 - a, 2, a * 2); } }
    }
    if (n + 1 >= total) { setTimeout(finishRec, beat * 1000); return; }
    ui.rec.timer = setTimeout(tickBeat, beat * 1000);
  };
  tickBeat();
}
function finishRec() {
  if (!ui.rec) return;
  const { role, k } = ui.rec, list = song.takes[recKey(role, k)] = takesOf(role, k).slice();
  const secs = Math.round(song.blocks[k].bars.length * 4 * 60 / song.tempo);
  list.forEach(t => { t.kept = false; });
  list.push({ n: list.length + 1, kept: true, len: `0:${String(secs).padStart(2, "0")}` });
  if (role === "rhythm" && ui.detect && filledBars(k) < 4) { applyProg(k, PROGS[(Object.keys(BLOCKS).indexOf(k) + 1) % PROGS.length].deg); ui.detected = k; }
  ui.rec = null; render();
}
function cancelRec() { if (ui.rec) { clearTimeout(ui.rec.timer); ui.rec = null; } }
// Draw the kept take (pretend audio, seeded by the take number so it looks the same each time).
function drawKeptTake() {
  const canvas = document.getElementById("rec-canvas");
  if (!canvas || ui.rec) return;
  const lbl = canvas.parentElement.querySelector(".rec-lbl");
  const role = /Lead/.test(lbl ? lbl.textContent : "") ? "lead" : "rhythm";
  const kept = takesOf(role, ui.block).find(t => t.kept);
  if (!kept) return;
  const g = canvas.getContext("2d"), color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#22543e";
  let seed = kept.n * 9301; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const beats = song.blocks[ui.block].bars.length * 4, w = canvas.width / beats;
  g.clearRect(0, 0, canvas.width, canvas.height); g.fillStyle = color;
  for (let b = 0; b < beats; b++) for (let x = 0; x < w; x += 3) { const a = (b % 2 ? 0.9 : 0.6) * Math.exp(-x / w * 1.6) * (0.5 + rnd() * 0.5) * 32; g.fillRect(b * w + x, 35 - a, 2, a * 2); }
}

// ============================================================ switcher, render and events
const VARIANTS = [["D", "Timeline + steps", VariantD]]; // A–C were dropped in #71; their code stays for reference
const cur = () => { const h = (location.hash || "#D").slice(1).toUpperCase(); return VARIANTS.find(v => v[0] === h) || VARIANTS[0]; };
function render() {
  const [key, name, View] = cur();
  document.getElementById("app").innerHTML = View();
  document.getElementById("sw-label").textContent = `${key} · ${name}`;
  renderPlay();
  drawKeptTake();
}
function cycle(d) { const i = VARIANTS.indexOf(cur()); location.hash = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]; }
window.addEventListener("hashchange", () => { ui.sel = null; ui.open = null; render(); });
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); else if (e.key === "ArrowRight") cycle(1);
});
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function override(k, field, delta) {
  const b = song.blocks[k].drums, base = { ...drumsFor(k) };
  base[field] = clamp(base[field] + delta, 1, 3); b.over = base;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const { act, v, k, p } = t.dataset;
  switch (act) {
    case "play": if (audio.playing) stop(); else play(k); return;
    case "key": setKey(v); break;
    case "tempo": song.tempo = clamp(song.tempo + Number(v), 60, 180); break;
    case "feel": song.feel = v; break;
    case "shape": setShape(v); break;
    case "del": if (song.order.length > 1) song.order.splice(Number(v), 1); break;
    case "addsec": song.order.push(v); break;
    case "slot": ui.block = k; ui.slot = Number(v); break;
    case "chord": { const b = song.blocks[k]; if (ui.block !== k) { ui.block = k; ui.slot = b.bars.findIndex(c => !c); if (ui.slot < 0) ui.slot = 0; }
      b.bars[ui.slot] = v; ui.slot = Math.min(b.bars.length - 1, ui.slot + 1); break; }
    case "prog": applyProg(k, PROGS[Number(v)].deg); break;
    case "soloverse": song.blocks.solo.bars = song.blocks.verse.bars.slice(); break;
    case "scale": leadOf(k).scale = v; break;
    case "hearscale": hearScale(v); return;
    case "listen": fakeListen(k); return;
    case "clear": song.blocks[k].bars = [null, null, null, null]; ui.block = k; ui.slot = 0; break;
    case "dmode": song.blocks[k].drums.mode = v; song.blocks[k].drums.over = null; break;
    case "dtrack": song.blocks[k].drums.track = v; song.blocks[k].drums.over = null; break;
    case "dbusy": override(k, "busy", Number(v)); break;
    case "dloud": override(k, "loud", Number(v)); break;
    case "dreset": song.blocks[k].drums.over = null; break;
    case "bass": song.blocks[k].bass = v; break;
    case "blk": ui.block = v; ui.slot = Math.max(0, song.blocks[v].bars.findIndex(c => !c)); break;
    case "goto": ui.step = Number(v); break;
    case "back": ui.step = Math.max(0, ui.step - 1); break;
    case "next": ui.step = Math.min(STEPS.length - 1, ui.step + 1); window.scrollTo(0, 0); break;
    case "gtab": ui.gtab[k] = v; break;
    case "intro": ui.introSeen[v] = !ui.introSeen[v]; break;
    case "check": ui.checks[v] = true; break;
    case "click": ui.click = !ui.click; break;
    case "detect": ui.detect = t.checked; return;
    case "rec": if (ui.rec) { cancelRec(); break; } startRec(v, k); return;
    case "keep": { const list = takesOf(v, k); list.forEach((x, i) => { x.kept = i === Number(t.dataset.i); }); break; }
    case "deltake": { const list = takesOf(v, k); list.splice(Number(t.dataset.i), 1); if (list.length && !list.some(x => x.kept)) list[list.length - 1].kept = true; break; }
    case "tone": song.tone[k] = v; song.chain[k] = TONES_ON(v); break;
    case "pedal": { const c = song.chain[k], i = c.indexOf(v); if (i >= 0) c.splice(i, 1); else c.push(v); break; }
    case "leadpart": leadOf(k).part = v; break;
    case "D-cell": { const k2 = song.order[Number(v)]; ui.block = k2; ui.slot = Math.max(0, song.blocks[k2].bars.findIndex(c => !c));
      ui.step = STEPS.findIndex(s => s.id === LANE_STEP[p]); break; }
    case "B-sel": ui.sel = { i: Number(v), part: p }; ui.open = null; ui.block = song.order[Number(v)]; break;
    case "B-open": { const i = song.order.indexOf(k); ui.sel = { i, part: p }; ui.block = k; ui.slot = Math.max(0, song.blocks[k].bars.findIndex(c => !c)); break; }
    case "B-close": ui.sel = null; ui.open = null; break;
    case "B-skip": ui.coachSkip++; break;
    case "B-setup": ui.open = "setup"; ui.sel = null; break;
    case "C-open": ui.open = ui.open && ui.open.k === k && ui.open.part === p ? null : { k, part: p }; ui.block = k; ui.slot = Math.max(0, song.blocks[k].bars.findIndex(c => !c)); break;
    case "C-move": { const i = Number(v), o = song.order; if (i < o.length - 1) [o[i], o[i + 1]] = [o[i + 1], o[i]]; else o.unshift(o.pop()); break; }
    case "C-shape": ui.open = ui.open === "shape" ? null : "shape"; break;
    default: return;
  }
  if (audio.playing) stop();
  if (ui.rec && act !== "detect") cancelRec();
  render();
});
render();
</script>
