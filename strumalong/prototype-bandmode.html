<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music OS · Band members prototype</title>
<!-- Throwaway UI prototype #73. Question: which member workspace best supports the agreed swipe navigation? Three variants on the existing prototype route, ?variant=A/B/C. All state is in memory. -->
<style>
:root{--bg:#f4f1e8;--ink:#222b27;--green:#22543e;--line:#d4d8cc;--soft:#e7ece3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);background:white;color:inherit;border-radius:12px;padding:10px 14px}button:focus-visible{outline:3px solid #b77e30}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:32px;letter-spacing:-1px}h2{font-size:25px}h3{font-size:18px}small,.muted{color:#637066}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#637066}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}.notice{padding:8px 16px;background:#f1dfb6;text-align:center;font-size:12px}main{max-width:1050px;margin:auto;padding:24px 20px 180px}header{margin-bottom:28px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.mode{padding:28px;border-radius:24px;background:white;border:1px solid var(--line);display:grid;gap:18px}.mode.band{background:#243c31;color:#fff}.mode.band small{color:#bbd2c2}.song{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.art{width:48px;height:48px;border-radius:9px;background:#c9b38c;display:grid;place-items:center;font-size:24px}.member-nav{display:flex;gap:7px;overflow:auto;margin:16px 0}.member-nav button{white-space:nowrap;flex:none;font-size:12px}.member-title{text-align:center;padding:14px 0 22px}.member-title .icon{font-size:42px}.section-row{display:flex;gap:6px;overflow:auto;margin-bottom:16px}.section-row button{flex:none}.workspace{min-width:0;touch-action:pan-y}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{flex:1;padding:8px}.editor{display:grid;gap:16px}.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chord{background:var(--soft);padding:22px 0;text-align:center;border-radius:12px;font-size:25px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font-size:13px}.timeline{overflow:auto;background:#202e27;border-radius:16px;color:white;padding:16px}.lane{display:grid;grid-template-columns:95px repeat(4,minmax(65px,1fr));gap:6px;margin:8px 0;align-items:center;min-width:410px}.lane small{color:#cbd7cf}.clip{padding:13px 5px;background:#466a53;border-radius:5px;font-size:12px;text-align:center}.lane.selected .clip{background:#c29b53;color:#18241d}.variantB{display:grid;grid-template-columns:220px 1fr;gap:20px}.variantC{display:grid;grid-template-columns:1fr 1fr;gap:18px}.prompt{background:#dde6d9;padding:24px;border-radius:20px;display:grid;gap:16px}.prompt h2{font-size:30px}.connect-dock{position:fixed;bottom:70px;left:0;right:0;padding:10px 20px;background:rgba(244,241,232,.96);border-top:1px solid var(--line);display:flex;justify-content:center}.connect-dock button{width:min(100%,600px)}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#17241c;color:#fff;border-radius:50px;display:flex;align-items:center;padding:5px;gap:12px;box-shadow:0 4px 20px #0003;white-space:nowrap;font-size:12px;z-index:5}.switcher button{background:transparent;border:0;color:white;border-radius:50%;padding:6px 13px}.state{font:11px ui-monospace,monospace;color:#637066;margin-top:24px;overflow-wrap:anywhere}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;color:var(--ink)}textarea{min-height:130px;resize:vertical}label{display:grid;gap:6px}.overlay{position:fixed;inset:0;background:#14241b88;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}.sheet{background:var(--bg);width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:24px;border-radius:24px;display:grid;gap:20px}.meter{height:15px;background:#dce3d8;border-radius:6px;overflow:hidden}.meter span{display:block;height:100%;background:#42805a;width:0;transition:width .3s}.sheet .notice{border-radius:10px}.transport{display:flex;gap:8px;margin:16px 0}.wave{height:70px;background:repeating-linear-gradient(90deg,#53735a 0 3px,transparent 3px 7px);clip-path:polygon(0 45%,8% 25%,15% 40%,22% 10%,30% 35%,40% 5%,50% 40%,60% 15%,70% 30%,80% 10%,90% 40%,100% 45%,100% 55%,90% 60%,80% 90%,70% 70%,60% 85%,50% 60%,40% 95%,30% 65%,22% 90%,15% 60%,8% 75%,0 55%)}.member-arrows{display:flex;align-items:center;justify-content:space-between;gap:12px}.member-arrows p{font-size:12px;color:#637066}output{display:block}.projects button{width:100%;text-align:left}.toast{background:#e7ece3;padding:12px;border-radius:10px;margin-top:14px}.slider{accent-color:var(--green)}
@media(max-width:650px){main{padding:18px 16px 180px}h1{font-size:28px}.home-grid,.variantB,.variantC{grid-template-columns:1fr}.mode{padding:22px}.variantB aside{display:flex;gap:10px;align-items:center;justify-content:space-between}.variantB aside .icon{font-size:30px}.variantB aside p{display:none}.member-nav{margin:10px 0}.member-title{padding:4px 0 16px}.member-title .icon{font-size:32px}.panel{padding:16px}.prompt{padding:20px}.variantC .prompt h2{font-size:25px}.connect-dock{bottom:70px}.switcher{gap:5px}.chord{padding:16px 0}.lane{grid-template-columns:80px repeat(4,65px)}}
.wrap{flex-wrap:wrap}.rhythm-timeline{background:#202e27;color:#edf4ee;border-radius:18px;padding:20px;min-width:0}.rhythm-timeline .eyebrow,.rhythm-timeline small{color:#b8cabb}.song-sections{display:flex;gap:5px;margin:18px 0;overflow:auto}.song-sections button{background:#354f3e;color:white;border-color:#56715d;min-width:85px;flex-basis:0}.song-sections small{display:block}.song-sections .chosen{background:#bd9753;color:#17271c}.song-sections .chosen small{color:#273c2e}.track-scroll{overflow:auto;margin-top:10px;padding-bottom:6px}.ruler{display:flex}.ruler span{flex:0 0 64px;font:11px ui-monospace,monospace;border-left:1px solid #617566;padding-left:5px}.rhythm-track{height:112px;position:relative;background:repeating-linear-gradient(90deg,#293e30 0 63px,#4c6253 63px 64px);border-radius:8px;margin-top:8px}.audio-clip{position:absolute;top:18px;height:76px;background:#86aa87;color:#13271a;border:2px solid transparent;border-radius:8px;cursor:grab;touch-action:none;user-select:none;overflow:hidden}.audio-clip.selected{border-color:#ffe4a8}.clip-label{display:block;font-size:11px;padding:5px 14px;white-space:nowrap;overflow:hidden}.mini-wave{display:block;height:28px;margin:0 12px;background:repeating-linear-gradient(90deg,#365c41 0 2px,transparent 2px 6px);clip-path:polygon(0 40%,10% 20%,20% 45%,30% 0,40% 35%,50% 10%,60% 45%,70% 15%,80% 40%,90% 5%,100% 40%,100% 60%,90% 95%,80% 60%,70% 85%,60% 55%,50% 90%,40% 65%,30% 100%,20% 55%,10% 80%,0 60%)}.trim{position:absolute;top:0;bottom:0;width:14px;display:grid;place-items:center;background:#ffffff40;cursor:ew-resize;z-index:1}.trim.left{left:0}.trim.right{right:0}.empty-track{padding:30px;display:block;color:#b8cabb}.foundation-grid{display:grid;grid-template-columns:minmax(200px,.75fr) minmax(0,1.25fr);gap:26px}.guide{background:#e7ece3;padding:22px;border-radius:14px;display:grid;gap:14px;align-content:start}.guide h2{font-size:26px}.progressions{display:grid;gap:8px}.progressions button{text-align:left}.progressions small{display:block;margin-top:4px}.progressions .active small{color:#d0dfd2}.record-settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rec-status{padding:20px;background:#f1dfb6;border-radius:12px;font-weight:650}.pedal{border:1px solid #b8cabb;border-radius:13px;background:#edf2e9;padding:15px;display:grid;gap:12px}.pedal.bypassed{opacity:.55}#click-beat{display:grid;place-items:center;min-width:30px;font-size:22px;font-weight:700}.rhythm-tabs{margin-top:0;margin-bottom:24px}.rhythm-tabs button{font-size:14px}@media(max-width:650px){.foundation-grid{grid-template-columns:1fr;gap:18px}.rhythm-timeline{padding:14px}.guide{padding:16px}.rhythm-tabs{gap:3px}.rhythm-tabs button{padding:8px 5px;font-size:12px}.record-settings{grid-template-columns:1fr 1fr;gap:10px}.record-settings input,.record-settings select{min-width:0}.guide h2{font-size:23px}.song-sections button{min-width:80px}.chords{gap:4px}.chords select{padding:8px 4px}.connect-dock{padding-bottom:10px}}

</style></head><body><div class="notice">Layout prototype · recording and connection are simulated · metronome plays sound</div><main id="app"></main><div id="dock"></div><div id="switch"></div><div id="modal"></div>
<script>
const members=['Singer','Rhythm guitarist','Drummer','Bassist','Lead guitarist','Producer'];
const icons=['♬','♮','◉','♫','♯','☷'];
const roles=['Shape the song, write the words and find its voice.','Give your song its chords and rhythmic foundation.','Find a groove that carries your song.','Connect the chords to the beat.','Add a melody, a riff or a solo.','Bring the band together and balance the sound.'];
const variantNames={A:'Member studio',B:'Timeline first',C:'Guided workspace',D:'Rhythm foundation'};
const params=new URLSearchParams(location.search);let variant=['A','B','C','D'].includes(params.get('variant'))?params.get('variant'):'D';
const state={page:'home',project:'Sunday afternoon',member:0,section:'Verse',tab:'Song',connected:false,input:'Example USB interface',signal:false,tuned:false,take:0,kept:false,lyrics:'A little light through the window\nA little room to begin',groove:'Easy rock',tone:'Clean strum',message:''};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,action,active=false){return `<button data-action="${action}" class="${active?'active':''}">${label}</button>`}
function sections(){return `<div class="section-row">${['Intro','Verse','Chorus','Solo'].map(s=>button(s,'section:'+s,state.section===s)).join('')}</div>`}
function navigation(){return `<div class="member-nav">${members.map((m,i)=>button(m,'member:'+i,state.member===i)).join('')}</div><div class="member-arrows">${button('‹','member-prev')}<p>Swipe to another band member · ${state.member+1} / 6</p>${button('›','member-next')}</div>`}
function tabs(){let ts=state.member===0?['Song','Lyrics','Voice']:state.member===1?['Chords','Record','Tone']:state.member===4?['Ideas','Record','Tone']:state.member===5?['Mix']:['Patterns'];if(!ts.includes(state.tab))state.tab=ts[0];return `<div class="tabs">${ts.map(t=>button(t,'tab:'+t,state.tab===t)).join('')}</div>`}
function editor(){let t=state.tab;if(t==='Lyrics')return `<label>Words for the ${state.section.toLowerCase()}<textarea id="lyrics">${esc(state.lyrics)}</textarea></label><small>Write a draft in your own words. Changes last for this visit.</small>`;
if(t==='Song')return `<h3>Give your song a starting point</h3><label>Song title<input id="title" value="${esc(state.project)}"></label><div class="chips"><span class="panel">G major</span><span class="panel">92 BPM</span><span class="panel">4 / 4</span></div><p class="muted">Intro → Verse → Chorus → Verse → Chorus → Solo</p>${button('Write the lyrics','tab:Lyrics')}`;
if(t==='Voice')return `<h3>Find the vocal melody</h3><p>Hum an idea over your chords, then shape the words around it.</p>${button('Preview guide-vocal workflow','message:Guide vocal recording would appear here. No audio is recorded in this prototype.')}`;
if(t==='Chords')return `<h3>${state.section} chords</h3><div class="chords">${['G','D','Em','C'].map(c=>`<div class="chord">${c}</div>`).join('')}</div><p class="muted">Four bars. Start with one downstroke on each beat.</p>${button('Record rhythm guitar','tab:Record')}`;
if(t==='Record')return `<h3>Your ${state.member===4?'lead':'rhythm'} part</h3><p class="muted">1-bar count-in · 92 BPM · ${state.section}</p><div class="transport">${button('● Simulate a take','record')}${button('Connect guitar','connect')}</div>${state.take?`<div class="wave"></div><div class="row between"><span>Example take ${state.take}</span>${button(state.kept?'✓ Kept':'Keep take','keep')}</div>`:'<div class="panel muted">Your take will sit here on the guitar lane.</div>'}<small>Recording is simulated. No microphone is accessed.</small>`;
if(t==='Tone')return `<h3>Start with a foundation tone</h3><div class="chips">${['Clean strum','Classic crunch','Indie jangle'].map(t=>button(t,'tone:'+t,state.tone===t)).join('')}</div><div class="panel">Drive → Amp → Cabinet → Reverb</div><p class="muted">${state.tone==='Clean strum'?'Clear chords with a little room around them.':'A starting point you can shape to suit your song.'}</p><small>Visual choices only; no sound processing.</small>`;
if(t==='Ideas')return `<h3>Find a part for your ${state.section.toLowerCase()}</h3><div class="chips">${button('Riff','message:Try a short phrase that repeats between vocal lines.')}${button('Solo','message:Try G major pentatonic for a bright, open feel.')}${button('Fills','message:Leave room for the singer; answer at the ends of phrases.')}</div><div class="panel">G major pentatonic · G A B D E</div>${button('Record an idea','tab:Record')}`;
if(t==='Mix')return `<h3>Make room for every member</h3>${members.slice(0,5).map((m,i)=>`<label>${m}<input class="slider" type="range" min="0" max="100" value="${i===1?85:65}" aria-label="${m} level"></label>`).join('')}<small>Mix controls are visual only.</small>`;
return `<h3>${state.member===2?'Choose the pulse':'Support the chords'}</h3><div class="chips">${(state.member===2?['Easy rock','Half time','Pop eighths']:['Root notes','Root and fifth','Walking']).map(g=>button(g,'groove:'+g,state.groove===g)).join('')}</div><div class="chords">${['1','2','3','4'].map(n=>`<div class="chord">${n}<small style="display:block">${state.member===2?'●':'G'}</small></div>`).join('')}</div><p class="muted">Choose a feel for this section. Pattern playback is simulated.</p>`}
function timeline(){return `<div class="timeline"><div class="lane"><small>92 BPM · 4/4</small>${['Intro','Verse','Chorus','Solo'].map(s=>`<small>${s}</small>`).join('')}</div>${members.map((m,i)=>`<div class="lane ${state.member===i?'selected':''}" data-action="member:${i}"><small>${m}</small>${['Intro','Verse','Chorus','Solo'].map(s=>`<div class="clip">${i===0?'Words':i===2?'● · ● ·':i===5?'Mix':'▰ ▰ ▰'}</div>`).join('')}</div>`).join('')}</div>`}
function VariantA(){return `<div class="member-title"><div class="icon">${icons[state.member]}</div><h1>${members[state.member]}</h1><p class="muted">${roles[state.member]}</p></div>${sections()}<div class="panel">${tabs()}<div class="editor">${editor()}</div></div>`}
function VariantB(){return `<div class="stack">${timeline()}<div class="variantB"><aside class="panel stack"><div class="icon">${icons[state.member]}</div><h2>${members[state.member]}</h2><p>${roles[state.member]}</p></aside><div class="panel">${sections()}${tabs()}<div class="editor">${editor()}</div></div></div></div>`}
function VariantC(){return `<div class="variantC"><div class="prompt"><span class="eyebrow">Your ${members[state.member].toLowerCase()}</span><h2>${['What is your song about?','Give the song a foundation.','How should the song move?','Hold down the low end.','What could you add?','Make it feel like a band.'][state.member]}</h2><p>${roles[state.member]}</p><p class="muted">Try something in the ${state.section.toLowerCase()}, then visit another member whenever you like.</p>${sections()}</div><div class="panel"><h3>Your workspace</h3>${tabs()}<div class="editor">${editor()}</div></div></div>`}
function home(){return `<header><span class="eyebrow">Music OS</span><h1>What do you want to play?</h1><p class="muted">Pick up your guitar. Find your way in.</p></header><div class="home-grid"><section class="mode"><span class="eyebrow">Jukebox</span><h2>Play a favourite.</h2><p class="muted">Songs to get you strumming.</p>${['Wild Thing','Zombie','Good Riddance'].map((s,i)=>`<div class="song"><span class="art">${['♬','♪','♫'][i]}</span><div style="flex:1"><b>${s}</b><br><small>Recommended for you</small></div>${button('›','song:'+s)}</div>`).join('')}</section><section class="mode band"><span class="eyebrow" style="color:#b9cdbf">Band Mode</span><h2>Make something yours.</h2><p>Bring your song to life with your band.</p>${button('+ Create new project','new')}<small>Example saved project</small><div class="projects">${button('Sunday afternoon ↗','open')}</div><small>G major · 92 BPM · a work in progress</small></section></div>`}
function render(){let body=state.page==='home'?home():state.page==='jukebox'?`<header>${button('‹ Home','home')}<h1 style="margin-top:20px">${esc(state.message)}</h1><p>Jukebox song destination</p></header><div class="panel">This prototype explores the Home and Band navigation. Use the live Jukebox for playback.<p style="margin-top:16px"><a href="https://dcromp.github.io/music-os/" target="_blank" rel="noopener">Open live Jukebox ↗</a></p></div>`:`<header class="row between">${button('‹ Home','home')}<div><span class="eyebrow">Band project</span><h3>${esc(state.project)}</h3></div><span class="muted">${rhythm.bpm} BPM</span></header>${navigation()}<section class="workspace">${({A:VariantA,B:VariantB,C:VariantC,D:VariantD})[variant]()}</section>${state.message?`<div class="toast">${esc(state.message)}</div>`:''}`;
$('#app').innerHTML=body+`<details class="state"><summary>Prototype state · ${variantNames[variant]} · ${state.page}${state.page==='band'?' · '+members[state.member]:''}</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify({...state,variant,...(variant==='D'?{rhythm}: {})},null,2))}</pre></details>`;
$('#dock').innerHTML=state.page==='band'?`<div class="connect-dock">${button(state.connected?'✓ Demo setup · Connect guitar':'⌁ Connect guitar','connect')}</div>`:'';
$('#switch').innerHTML=['localhost','127.0.0.1',''].includes(location.hostname)?`<div class="switcher">${button('←','variant-prev')}<span>Layout ${variant} · ${variantNames[variant]}</span>${button('→','variant-next')}</div>`:'';
}
function switchVariant(delta){variant=['A','B','C','D'][(['A','B','C','D'].indexOf(variant)+delta+4)%4];let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
function connection(){ $('#modal').innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Connect guitar"><div class="row between"><h2>Connect guitar</h2>${button('✕','close')}</div><div class="notice">Demo setup only · your Focusrite is not being detected</div><label>1. Choose input<select id="input"><option>Example USB interface</option><option>Example built-in input</option></select></label><div class="stack"><b>2. Check your signal</b><p class="muted">In the working app, strum your guitar and watch this meter.</p><div class="meter"><span style="width:${state.signal?'65%':'0'}"></span></div>${button(state.signal?'✓ Example signal shown':'Show example signal','signal')}</div><div class="stack"><b>3. Tune your guitar</b><div class="panel" style="text-align:center"><h1>${state.tuned?'E · In tune':'—'}</h1><small>Standard tuning · E A D G B E</small></div>${button('Show example tuning','tune')}</div>${button('Done · return to band','done')}</div></div>`;$('#input').value=state.input;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [action,...rest]=b.dataset.action.split(':');const value=rest.join(':');if(action.startsWith('r-')){rhythmAction(action.slice(2),value);return}if(action==='variant-prev'||action==='variant-next'){switchVariant(action==='variant-next'?1:-1);return}if(action==='connect'){connection();return}if(action==='close'){$('#modal').innerHTML='';return}if(action==='signal'){state.signal=true;connection();return}if(action==='tune'){state.tuned=true;connection();return}if(action==='done'){state.connected=state.signal;$('#modal').innerHTML=''}if(action==='home'){state.page='home';stopClick()}if(action==='new'||action==='open'){state.page='band';state.project=action==='new'?'Untitled song':'Sunday afternoon';state.message='';if(variant==='D')state.member=1;}if(action==='song'){state.page='jukebox';state.message=value}if(action==='member')state.member=Number(value);if(action==='member-prev'||action==='member-next')state.member=(state.member+(action==='member-next'?1:5))%6;if(action==='section')state.section=value;if(action==='tab')state.tab=value;if(action==='tone')state.tone=value;if(action==='groove')state.groove=value;if(action==='record'){state.take++;state.kept=false}if(action==='keep')state.kept=true;if(action==='message')state.message=value;render()});
document.addEventListener('input',e=>{if(e.target.id==='lyrics')state.lyrics=e.target.value;if(e.target.id==='title')state.project=e.target.value;if(e.target.id==='input')state.input=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||$('#modal').innerHTML)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
let touchStart=null;document.addEventListener('touchstart',e=>{if(e.target.closest('.workspace')&&!e.target.closest('input,textarea,select,button,.track-scroll'))touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};else touchStart=null},{passive:true});document.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){state.member=(state.member+(dx<0?1:5))%6;render()}touchStart=null},{passive:true});
// Hybrid D: rhythm owns the song foundation. Audio clips are examples, not recordings.
const rhythm={focus:'Foundation',bpm:92,meter:4,sections:[{name:'Intro',bars:4,chords:['G','D','Em','C']},{name:'Verse',bars:8,chords:['G','D','Em','C']},{name:'Chorus',bars:8,chords:['C','G','D','Em']},{name:'Solo',bars:8,chords:['G','D','Em','C']}],selected:1,clips:[{id:1,section:1,start:0,in:0,out:4,sourceBars:4,name:'Example take 1'}],clipId:1,nextId:2,rec:'idle',autoStart:false,stopMode:'Section end',pedals:[{name:'Amp',on:true,amount:45},{name:'Reverb',on:true,amount:20}],dry:false,click:false,message:'',beat:0};
let clickTimer=null,audioCtx=null,dragEdit=null;
const currentSection=()=>rhythm.sections[rhythm.selected];
const currentClip=()=>rhythm.clips.find(c=>c.id===rhythm.clipId);
const snap=n=>Math.round(n*2)/2;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function startClick(){audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();clearInterval(clickTimer);rhythm.beat=0;const tick=()=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=rhythm.beat%4===0?1100:750;gain.gain.setValueAtTime(.05,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.045);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.05);rhythm.beat++;const el=document.querySelector('#click-beat');if(el)el.textContent=((rhythm.beat-1)%4)+1;};tick();clickTimer=setInterval(tick,60000/rhythm.bpm)}
function stopClick(){clearInterval(clickTimer);rhythm.click=false}
function rhythmTimeline(){const sec=currentSection();return `<section class="rhythm-timeline"><div class="row between wrap"><div><span class="eyebrow">Rhythm guitar only</span><h3>Your song foundation</h3></div><small>${rhythm.sections.reduce((n,s)=>n+s.bars,0)} bars · ${rhythm.bpm} BPM · 4/4</small></div><div class="song-sections">${rhythm.sections.map((s,i)=>`<button data-action="r-section:${i}" class="${i===rhythm.selected?'chosen':''}" style="flex-grow:${s.bars}"><b>${s.name}</b><small>${s.bars} bars</small></button>`).join('')}</div><div class="row between wrap"><span>${sec.name} · drag a clip or either edge</span><small>Take lanes · snap: ½ bar</small></div><div class="track-scroll"><div class="ruler" style="width:${sec.bars*64}px">${Array.from({length:sec.bars},(_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="rhythm-track" style="width:${sec.bars*64}px;height:${Math.max(1,rhythm.clips.filter(c=>c.section===rhythm.selected).length)*90+22}px">${rhythm.clips.filter(c=>c.section===rhythm.selected).map((c,row)=>`<div class="audio-clip ${c.id===rhythm.clipId?'selected':''}" data-clip="${c.id}" style="top:${row*90+18}px;left:${c.start*64}px;width:${(c.out-c.in)*64}px" role="button" tabindex="0" aria-label="${esc(c.name)}, starts at bar ${c.start+1}, ${c.out-c.in} bars"><span class="trim left" data-edge="left" title="Trim start">┃</span><span class="clip-label">${c.name}</span><span class="mini-wave"></span><span class="trim right" data-edge="right" title="Trim end">┃</span></div>`).join('')}${!rhythm.clips.some(c=>c.section===rhythm.selected)?'<span class="empty-track">Record an idea for this section</span>':''}</div></div></section>`}
function foundation(){const sec=currentSection();return `<div class="foundation-grid"><div class="guide"><span class="eyebrow">Build a place to start</span><h2>How should ${sec.name.toLowerCase()} feel?</h2><p>Choose its length, then try a chord sequence. You can reshape the song as you play.</p><label>Bars in ${sec.name}<select data-r-field="bars">${[4,8,12,16].map(n=>`<option ${sec.bars===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Tempo (BPM)<input type="number" min="40" max="220" value="${rhythm.bpm}" data-r-field="bpm"></label><small>Key: G major · 4 beats per bar</small></div><div class="stack"><h3>Chord sequences to try</h3><p class="muted">Start with one chord per bar. Repeat the four-bar idea to fill the section.</p><div class="progressions">${[['G','D','Em','C'],['G','C','D','G'],['Em','C','G','D']].map((p,i)=>`<button data-action="r-progression:${i}" class="${p.join()===sec.chords.join()?'active':''}"><b>${p.join(' → ')}</b><small>${['Familiar lift · I–V–vi–IV','Simple resolution · I–IV–V–I','Minor opening · vi–IV–I–V'][i]}</small></button>`).join('')}</div><div class="chords">${sec.chords.map((c,i)=>`<label>Bar ${i+1}<select aria-label="Chord for bar ${i+1}" data-r-chord="${i}">${['G','Am','Bm','C','D','Em'].map(v=>`<option ${v===c?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div><small>${sec.bars/4} × this four-bar phrase = ${sec.bars} bars. These are starting suggestions, not rules.</small>${button('Try recording this sequence →','r-tab:Record')}</div></div>`}
function recordPanel(){return `<div class="foundation-grid"><div class="guide"><span class="eyebrow">Hands on the guitar</span><h2>Try an idea.</h2><p>${currentSection().chords.join(' → ')} · ${currentSection().bars} bars</p><p>You can record another take, trim it, or move it later. Your original dry take stays available.</p><small>Prototype: use the buttons to simulate playing and silence.</small></div><div class="stack"><div class="record-settings"><label>Start<select data-r-field="autoStart"><option ${!rhythm.autoStart?'selected':''}>Record button</option><option ${rhythm.autoStart?'selected':''}>When I start playing</option></select></label><label>Stop<select data-r-field="stopMode">${['Section end','After silence','Manual'].map(v=>`<option ${rhythm.stopMode===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="muted">${rhythm.autoStart?'Proposed: arm first, then detect your first note.':'Count-in: one bar before the take.'} ${rhythm.stopMode==='After silence'?'Proposed: stop after 2 seconds of silence.':''}</p><div class="rec-status" role="status">${{idle:'Ready for a take',count:'Count-in · 1 2 3 4',armed:'Armed · waiting for you to play',recording:'Recording example take…'}[rhythm.rec]}</div><div class="chips">${rhythm.rec==='idle'?button(rhythm.autoStart?'Arm simulated recording':'● Start simulated take','r-arm'):''}${rhythm.rec==='count'?button('Finish count-in','r-count'):''}${rhythm.rec==='armed'?button('Simulate first note','r-first-note'):''}${rhythm.rec==='recording'?button('■ Stop and keep example take','r-stop'):''}${rhythm.rec==='recording'&&rhythm.stopMode==='After silence'?button('Simulate 2s silence','r-silence'):''}${rhythm.rec==='recording'&&rhythm.stopMode==='Section end'?button('Simulate section end','r-end'):''}${rhythm.rec!=='idle'?button('Cancel','r-cancel'):''}</div><small>No audio is being recorded. Auto-start thresholds and silence handling need a real guitar test.</small></div></div>`}
function editPanel(){const c=currentClip();return `<div class="foundation-grid"><div class="guide"><span class="eyebrow">Shape the take</span><h2>Keep the part you like.</h2><p>Drag a clip along its lane. Drag its edges to trim. The controls here offer the same edits without dragging.</p><p>Trim changes the selected part of the take; it keeps the original source.</p></div><div class="stack">${c?`<h3>${c.name}</h3><div class="record-settings"><label>Move to section<select data-r-field="clipSection">${rhythm.sections.map((s,i)=>`<option value="${i}" ${c.section===i?'selected':''}>${s.name}</option>`).join('')}</select></label><label>Start at bar<input type="number" min="1" step="0.5" max="${currentSection().bars}" value="${c.start+1}" data-r-field="clipStart"></label><label>Source in (bars)<input type="number" min="0" step="0.5" max="${c.out-.5}" value="${c.in}" data-r-field="clipIn"></label><label>Source out (bars)<input type="number" min="${c.in+.5}" step="0.5" max="${c.sourceBars}" value="${c.out}" data-r-field="clipOut"></label></div><p>${c.out-c.in} bars used from a ${c.sourceBars}-bar original dry take.</p><div class="chips">${button('Restore full take','r-restore')}${button('Duplicate clip','r-duplicate')}${button('Remove clip','r-delete')}</div>`:'<p>Select a clip on the timeline, or record an idea first.</p>'}</div></div>`}
function pedalPanel(){return `<div class="foundation-grid"><div class="guide"><span class="eyebrow">Try a different sound</span><h2>Same take. New tone.</h2><p>Add or remove pedals without recording again. Bypass a pedal to compare it with the dry guitar.</p>${button(rhythm.dry?'Dry comparison selected':'Compare dry take','r-dry',rhythm.dry)}<small>All pedal changes are visual in this prototype.</small></div><div class="stack"><span class="eyebrow">Original dry take → pedal chain → output</span>${rhythm.pedals.map((p,i)=>`<div class="pedal ${!p.on||rhythm.dry?'bypassed':''}"><div class="row between"><b>${p.name}</b><div class="row">${button(p.on?'On':'Bypassed','r-bypass:'+i,p.on)}${button('×','r-remove:'+i)}</div></div><label>${p.name==='Reverb'?'Mix':'Amount'}<input type="range" min="0" max="100" value="${p.amount}" data-pedal="${i}"></label></div>`).join('')}<div class="chips">${['Overdrive','Chorus','Delay','Reverb'].map(p=>button('+ '+p,'r-add:'+p)).join('')}</div><small>Chain order follows the cards above. The source take is unchanged.</small></div></div>`}
function VariantD(){if(state.member!==1)return VariantA();return `<div class="stack"><div class="row between wrap"><div><span class="eyebrow">Your rhythm guitarist</span><h1>Build the foundation.</h1></div><div class="row">${button(rhythm.click?'Stop metronome':'▶ Metronome','r-click',rhythm.click)}<span id="click-beat" aria-label="Metronome beat">${rhythm.click?((rhythm.beat-1)%4)+1:'—'}</span></div></div>${rhythmTimeline()}<div class="panel"><div class="tabs rhythm-tabs">${['Foundation','Record','Edit','Pedals'].map(t=>button(t,'r-tab:'+t,rhythm.focus===t)).join('')}</div>${({Foundation:foundation,Record:recordPanel,Edit:editPanel,Pedals:pedalPanel})[rhythm.focus]()}</div>${rhythm.message?`<div class="toast" role="status">${esc(rhythm.message)}</div>`:''}<small>Example waveforms and recording · metronome produces sound · edits last for this visit.</small></div>`}
function finishTake(){const id=rhythm.nextId++;rhythm.clips.push({id,section:rhythm.selected,start:0,in:0,out:currentSection().bars,sourceBars:currentSection().bars,name:'Example take '+id});rhythm.clipId=id;rhythm.rec='idle';rhythm.focus='Edit';rhythm.message='Example take added. Drag or trim it on the rhythm lane.'}
function rhythmAction(action,value){rhythm.message='';const c=currentClip();if(action==='tab')rhythm.focus=value;if(action==='section'){rhythm.selected=Number(value);state.section=currentSection().name;rhythm.clipId=rhythm.clips.find(c=>c.section===rhythm.selected)?.id??null;rhythm.rec='idle'}if(action==='progression')currentSection().chords=[['G','D','Em','C'],['G','C','D','G'],['Em','C','G','D']][Number(value)].slice();if(action==='arm')rhythm.rec=rhythm.autoStart?'armed':'count';if(action==='count'||action==='first-note')rhythm.rec='recording';if(['stop','silence','end'].includes(action))finishTake();if(action==='cancel')rhythm.rec='idle';if(action==='dry')rhythm.dry=!rhythm.dry;if(action==='bypass')rhythm.pedals[Number(value)].on=!rhythm.pedals[Number(value)].on;if(action==='remove')rhythm.pedals.splice(Number(value),1);if(action==='add')rhythm.pedals.push({name:value,on:true,amount:35});if(action==='delete'&&c){rhythm.clips=rhythm.clips.filter(x=>x!==c);rhythm.clipId=null}if(action==='restore'&&c){if(c.start+c.sourceBars<=currentSection().bars){c.in=0;c.out=c.sourceBars}else rhythm.message='Move the clip earlier or make the section longer to restore the full take.'}if(action==='duplicate'&&c){const length=c.out-c.in;if(c.start+length*2<=currentSection().bars){const id=rhythm.nextId++;rhythm.clips.push({...c,id,start:c.start+length,name:c.name+' copy'});rhythm.clipId=id}else rhythm.message='There is not enough room after this clip. Make the section longer first.'}if(action==='click'){if(rhythm.click)stopClick();else{rhythm.click=true;startClick()}}render()}
document.addEventListener('change',e=>{const field=e.target.dataset.rField,c=currentClip();if(!field&&e.target.dataset.rChord===undefined)return;rhythm.message='';let n=Number(e.target.value);if(field==='bars'){if(rhythm.clips.some(c=>c.section===rhythm.selected&&c.start+c.out-c.in>n))rhythm.message='A take extends past that length. Trim or move it before shortening the section.';else currentSection().bars=n}if(field==='bpm'){rhythm.bpm=clamp(Number.isFinite(n)&&n?n:92,40,220);if(rhythm.click)startClick()}if(field==='autoStart'){rhythm.autoStart=e.target.value==='When I start playing';rhythm.rec='idle'}if(field==='stopMode')rhythm.stopMode=e.target.value;if(field==='clipSection'&&c){if(c.out-c.in>rhythm.sections[n].bars)rhythm.message='Trim this clip before moving it to a shorter section.';else{c.section=n;c.start=0;rhythm.selected=n}}if(field==='clipStart'&&c)c.start=clamp(snap(n-1),0,currentSection().bars-(c.out-c.in));if(field==='clipIn'&&c)c.in=clamp(snap(n),Math.max(0,c.out-(currentSection().bars-c.start)),c.out-.5);if(field==='clipOut'&&c)c.out=clamp(snap(n),c.in+.5,Math.min(c.sourceBars,c.in+currentSection().bars-c.start));if(e.target.dataset.rChord!==undefined)currentSection().chords[Number(e.target.dataset.rChord)]=e.target.value;render()});
document.addEventListener('input',e=>{if(e.target.dataset.pedal!==undefined)rhythm.pedals[Number(e.target.dataset.pedal)].amount=Number(e.target.value)});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-clip]');if(!el)return;e.preventDefault();const c=rhythm.clips.find(c=>c.id===Number(el.dataset.clip));rhythm.clipId=c.id;dragEdit={id:c.id,x:e.clientX,edge:e.target.dataset.edge,original:{...c},el};el.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!dragEdit)return;const c=rhythm.clips.find(c=>c.id===dragEdit.id),o=dragEdit.original,delta=snap((e.clientX-dragEdit.x)/64);if(dragEdit.edge==='left'){const d=clamp(delta,-Math.min(o.in,o.start),o.out-o.in-.5);c.in=o.in+d;c.start=o.start+d}else if(dragEdit.edge==='right')c.out=clamp(o.out+delta,o.in+.5,Math.min(o.sourceBars,o.in+currentSection().bars-o.start));else c.start=clamp(o.start+delta,0,currentSection().bars-(o.out-o.in));dragEdit.el.style.left=c.start*64+'px';dragEdit.el.style.width=(c.out-c.in)*64+'px'});
function releaseClip(){if(!dragEdit)return;dragEdit=null;rhythm.focus='Edit';render()}
document.addEventListener('pointerup',releaseClip);document.addEventListener('pointercancel',releaseClip);
document.addEventListener('keydown',e=>{const el=e.target.closest('[data-clip]');if(el&&['Enter',' '].includes(e.key)){e.preventDefault();rhythm.clipId=Number(el.dataset.clip);rhythm.focus='Edit';render()}});

if(params.get('member')==='rhythm'){state.page='band';state.member=1}render();
</script></body></html>
