<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bandmaker rhythm foundation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110E}
a{color:#5CC8B5}a:hover{color:#8EE0D1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #F5EEE4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 6px; display: flex; align-items: center; gap: 12px">
    <a href="Bandmaker-Key.dc.html" aria-label="Back to key" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: #1F1A15; border: 1px solid #3A3028; color: #F5EEE4; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1">
      <div style="font-size: 16px; font-weight: 600">Untitled in G</div>
      <div style="font-size: 13px; color: #B5A796">Happy and bright · G major · 96 BPM</div>
    </div>
    <button aria-label="Play" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #5CC8B5; color: #0B1A17; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
    </button>
  </div>

  <div style="padding: 8px 0 2px; display: flex; gap: 10px; justify-content: center; align-items: flex-end">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
      <div style="{{m.wrap}}">
        <div style="{{m.disc}}"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800">{{m.short}}</span></div>
        <span style="{{m.labelStyle}}">{{m.name}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: center; gap: 6px; padding: 8px 0 12px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="{{d}}"></span></sc-for>
  </div>

  <div style="flex: 1; padding: 0 20px 22px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="{{s.bar}}"></span>
          <span style="{{s.label}}">{{s.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05; letter-spacing: -0.02em">Seven chords live in G major</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #B5A796">Start with the four easy shapes. The rest add colour later.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{chords}}" as="c" hint-placeholder-count="7">
        <button style="{{c.style}}">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; opacity: 0.8">{{c.deg}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{c.name}}</span>
          <span style="font-size: 11px">{{c.tag}}</span>
        </button>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">Try a sequence</h2>
      <sc-for list="{{seqs}}" as="q" hint-placeholder-count="2">
        <div style="{{q.style}}">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.02em">{{q.chords}}</span>
            <span style="font-size: 12px; color: #B5A796">{{q.deg}}  ·  {{q.note}}</span>
          </div>
          <button aria-label="Hear {{q.chords}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #5CC8B5; color: #0B1A17; display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
          </button>
        </div>
      </sc-for>
    </section>

    <div style="flex: 1"></div>
    <a href="Bandmaker-Bass.dc.html" style="height: 56px; border-radius: 18px; background: #5CC8B5; color: #0B1A17; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Use G D Em C · bring in the band</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Singer', short: 'Vo' }, { name: 'Drums', short: 'Dr' },
      { name: 'Rhythm', short: 'Rh', active: true },
      { name: 'Bass', short: 'Ba' }, { name: 'Lead', short: 'Ld' }
    ];
    const members = list.map(m => {
      const size = m.active ? 64 : 44;
      return { ...m,
        wrap: 'display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: ' + (m.active ? 1 : 0.55),
        disc: 'width: ' + size + 'px; height: ' + size + 'px; border-radius: ' + size / 2 + 'px; display: flex; align-items: center; justify-content: center; font-size: ' + (m.active ? 22 : 15) + 'px; ' +
          (m.active ? 'background: #5CC8B5; color: #0B1A17' : 'background: #1F1A15; color: #B5A796; border: 1px dashed #5E5246'),
        labelStyle: 'font-size: ' + (m.active ? 14 : 12) + 'px; font-weight: ' + (m.active ? 600 : 500) + '; color: ' + (m.active ? '#F5EEE4' : '#B5A796') };
    });
    const dots = [0, 1, 2, 3, 4].map(i => 'width: ' + (i === 2 ? 18 : 6) + 'px; height: 6px; border-radius: 3px; background: ' + (i === 2 ? '#5CC8B5' : '#3A3028'));
    const steps = ['Feel', 'Key', 'Chords', 'Song'].map((n, i) => ({ name: n,
      bar: 'height: 4px; border-radius: 2px; background: ' + (i <= 2 ? '#5CC8B5' : '#3A3028'),
      label: 'font-size: 12px; font-weight: ' + (i === 2 ? 700 : 500) + '; color: ' + (i === 2 ? '#F5EEE4' : '#B5A796') }));
    const base = 'height: 66px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: Inter, sans-serif; ';
    const starter = base + 'background: #5CC8B5; color: #0B1A17; border: 0';
    const later = base + 'background: #1F1A15; color: #B5A796; border: 1px dashed #5E5246';
    const chords = [
      { deg: 'I', name: 'G', tag: 'home', style: starter },
      { deg: 'IV', name: 'C', tag: 'lift', style: starter },
      { deg: 'V', name: 'D', tag: 'pull home', style: starter },
      { deg: 'vi', name: 'Em', tag: 'softer', style: starter },
      { deg: 'ii', name: 'Am', tag: 'later', style: later },
      { deg: 'iii', name: 'Bm', tag: 'barre', style: later },
      { deg: 'vii°', name: 'F♯°', tag: 'tension', style: later }
    ];
    const seqBase = 'border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; ';
    return { members, dots, steps, chords,
      seqs: [
        { chords: 'G  D  Em  C', deg: 'I V vi IV', note: 'big, singable', style: seqBase + 'background: #173A34; border: 2px solid #5CC8B5' },
        { chords: 'G  C  G  D', deg: 'I IV I V', note: 'classic, easy', style: seqBase + 'background: #1F1A15; border: 1px solid #3A3028' }
      ] };
  }
}
</script>
</body>
</html>
