<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bandmaker bass part</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110E}
a{color:#5CC8B5}a:hover{color:#8EE0D1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #F5EEE4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 20px 22px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Bandmaker-Foundation.dc.html" aria-label="Back to rhythm" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: #1F1A15; border: 1px solid #3A3028; color: #F5EEE4; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1">
      <div style="font-size: 16px; font-weight: 600">Untitled in G</div>
      <div style="font-size: 13px; color: #B5A796">Bass follows your chords: G D Em C</div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; justify-content: center; align-items: flex-end">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
      <div style="{{m.wrap}}">
        <div style="{{m.disc}}"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800">{{m.short}}</span></div>
        <span style="{{m.labelStyle}}">{{m.name}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: center; gap: 6px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="{{d}}"></span></sc-for>
  </div>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #B5A796; text-transform: uppercase; letter-spacing: 0.06em">Pick a bass line</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{patterns}}" as="p" hint-placeholder-count="4">
        <button onClick="{{p.pick}}" style="{{p.style}}">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #B5A796">{{p.note}}</span>
        </button>
      </sc-for>
    </div>
  </section>

  <section style="background: #1F1A15; border: 1px solid #3A3028; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px">
      <span style="font-weight: 600">Playable tab · bars 1 to 2</span>
      <span style="color: #B5A796">standard EADG</span>
    </div>
    <div style="display: grid; grid-template-columns: 22px repeat(8, minmax(0, 1fr)); row-gap: 0; font-family: 'JetBrains Mono', monospace">
      <span></span>
      <sc-for list="{{chordRow}}" as="h" hint-placeholder-count="8"><span style="font-size: 13px; font-weight: 700; color: #5CC8B5; height: 20px">{{h}}</span></sc-for>
      <span></span>
      <sc-for list="{{countRow}}" as="h" hint-placeholder-count="8"><span style="font-size: 11px; color: #B5A796; height: 18px">{{h}}</span></sc-for>
      <sc-for list="{{tab}}" as="cell" hint-placeholder-count="36">
        <span style="{{cell.style}}"><span style="{{cell.inner}}">{{cell.text}}</span></span>
      </sc-for>
    </div>
  </section>

  <div style="background: #173A34; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45">
    Root and fifth: play the chord's name note, then the note five steps up. Your fingers stay in one spot.
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 56px; border-radius: 18px; border: 1px solid #3A3028; background: #1F1A15; color: #F5EEE4; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Hear with guitar</button>
    <button style="flex: 1; height: 56px; border-radius: 18px; border: 0; background: #5CC8B5; color: #0B1A17; font-family: Inter, sans-serif; font-size: 15px; font-weight: 700">Use this line</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'fifth' }; }
  renderVals() {
    const base = 'min-height: 64px; padding: 10px 12px; border-radius: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; color: #F5EEE4; font-family: Inter, sans-serif; text-align: left; ';
    const list = [
      { id: 'held', name: 'Held roots', note: 'One note per bar' },
      { id: 'quarter', name: 'Steady roots', note: 'Every beat' },
      { id: 'fifth', name: 'Root and fifth', note: 'Two notes, bouncing' },
      { id: 'walk', name: 'Chord tones', note: 'Walks between chords' }
    ];
    const patterns = list.map(p => ({ ...p,
      style: base + (this.state.picked === p.id ? 'background: #173A34; border: 2px solid #5CC8B5' : 'background: #14110E; border: 1px solid #3A3028'),
      pick: () => this.setState({ picked: p.id }) }));
    const strings = ['G', 'D', 'A', 'E'];
    const notes = { E: ['3', '', '3', '', '', '', '', ''], A: ['', '5', '', '5', '5', '', '5', ''], D: ['', '', '', '', '', '7', '', '7'], G: ['', '', '', '', '', '', '', ''] };
    const tab = [];
    strings.forEach(s => {
      tab.push({ text: s, inner: '', style: 'font-size: 11px; color: #B5A796; height: 26px; display: flex; align-items: center' });
      notes[s].forEach((n, i) => tab.push({ text: n, inner: n ? 'background: #1F1A15; padding: 0 3px' : '',
        style: 'height: 26px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #F5EEE4; background: linear-gradient(#5E5246, #5E5246) center / 100% 1px no-repeat' + (i === 3 ? '; border-right: 2px solid #5E5246' : '') }));
    });
    const mList = [
      { name: 'Singer', short: 'Vo' }, { name: 'Drums', short: 'Dr' },
      { name: 'Rhythm', short: 'Rh', done: true },
      { name: 'Bass', short: 'Ba', active: true }, { name: 'Lead', short: 'Ld' }
    ];
    const members = mList.map(m => {
      const size = m.active ? 64 : 44;
      return { ...m,
        wrap: 'display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: ' + (m.active ? 1 : 0.8),
        disc: 'width: ' + size + 'px; height: ' + size + 'px; border-radius: ' + size / 2 + 'px; display: flex; align-items: center; justify-content: center; font-size: ' + (m.active ? 22 : 15) + 'px; ' +
          (m.active ? 'background: #5CC8B5; color: #0B1A17' : (m.done ? 'background: #173A34; color: #5CC8B5; border: 1px solid #5CC8B5' : 'background: #1F1A15; color: #B5A796; border: 1px solid #3A3028')),
        labelStyle: 'font-size: ' + (m.active ? 14 : 12) + 'px; font-weight: ' + (m.active ? 600 : 500) + '; color: ' + (m.active ? '#F5EEE4' : '#B5A796') };
    });
    const dots = [0, 1, 2, 3, 4].map(i => 'width: ' + (i === 3 ? 18 : 6) + 'px; height: 6px; border-radius: 3px; background: ' + (i === 3 ? '#5CC8B5' : '#3A3028'));
    return { patterns, tab, members, dots,
      chordRow: ['G', '', '', '', 'D', '', '', ''],
      countRow: ['1', '2', '3', '4', '1', '2', '3', '4'] };
  }
}
</script>
</body>
</html>
