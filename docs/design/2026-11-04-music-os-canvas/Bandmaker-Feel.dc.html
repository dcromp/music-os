<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bandmaker new song feel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110E}
a{color:#5CC8B5}a:hover{color:#8EE0D1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #F5EEE4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 6px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: #1F1A15; border: 1px solid #3A3028; color: #F5EEE4; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1">
      <div style="font-size: 16px; font-weight: 600">New song</div>
      <div style="font-size: 13px; color: #B5A796">Not saved yet</div>
    </div>
  </div>

  <div style="padding: 8px 0 2px; display: flex; gap: 10px; justify-content: center; align-items: flex-end">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
      <div style="{{m.wrap}}">
        <div style="{{m.disc}}"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800">{{m.short}}</span></div>
        <span style="{{m.labelStyle}}">{{m.name}}</span>
      </div>
    </sc-for>
  </div>
  <div style="text-align: center; font-size: 12px; color: #B5A796; padding: 6px 20px 14px">The rest of the band joins once you have chords</div>

  <div style="flex: 1; padding: 0 20px 22px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="{{s.bar}}"></span>
          <span style="{{s.label}}">{{s.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em">How should it feel?</h1>
      <p style="margin: 0; font-size: 14px; color: #B5A796; line-height: 1.4">A starting point, not a rule. Hear each one first.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{feels}}" as="f" hint-placeholder-count="4">
        <div style="{{f.style}}">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.1">{{f.name}}</span>
            <span style="font-size: 13px; line-height: 1.35; color: #B5A796">{{f.note}}</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #5CC8B5">{{f.chords}}</span>
            <button aria-label="Hear {{f.name}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #5CC8B5; color: #0B1A17; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex: 1"></div>
    <a href="Bandmaker-Key.dc.html" style="height: 56px; border-radius: 18px; background: #5CC8B5; color: #0B1A17; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Happy and bright: pick a key</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Singer', short: 'Vo' }, { name: 'Drums', short: 'Dr' },
      { name: 'Rhythm', short: 'Rh', active: true },
      { name: 'Bass', short: 'Ba' }, { name: 'Lead', short: 'Ld' }
    ];
    const members = list.map(m => {
      const size = m.active ? 64 : 44;
      return { ...m,
        wrap: 'display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: ' + (m.active ? 1 : 0.55),
        disc: 'width: ' + size + 'px; height: ' + size + 'px; border-radius: ' + size / 2 + 'px; display: flex; align-items: center; justify-content: center; font-size: ' + (m.active ? 22 : 15) + 'px; ' +
          (m.active ? 'background: #5CC8B5; color: #0B1A17' : 'background: #1F1A15; color: #B5A796; border: 1px dashed #5E5246'),
        labelStyle: 'font-size: ' + (m.active ? 14 : 12) + 'px; font-weight: ' + (m.active ? 600 : 500) + '; color: ' + (m.active ? '#F5EEE4' : '#B5A796') };
    });
    const steps = ['Feel', 'Key', 'Chords', 'Song'].map((n, i) => ({ name: n,
      bar: 'height: 4px; border-radius: 2px; background: ' + (i === 0 ? '#5CC8B5' : '#3A3028'),
      label: 'font-size: 12px; font-weight: ' + (i === 0 ? 700 : 500) + '; color: ' + (i === 0 ? '#F5EEE4' : '#B5A796') }));
    const card = 'min-height: 140px; box-sizing: border-box; padding: 14px; border-radius: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; ';
    const off = card + 'background: #1F1A15; border: 1px solid #3A3028';
    const on = card + 'background: #173A34; border: 2px solid #5CC8B5';
    return { members, steps,
      feels: [
        { name: 'Happy and bright', note: 'Major key, mid tempo', chords: 'G C D', style: on },
        { name: 'Reflective', note: 'Minor colour, slower', chords: 'Am F C G', style: off },
        { name: 'Heavy', note: 'Power chords, driving', chords: 'E5 G5 A5', style: off },
        { name: 'I have chords', note: 'Type or play them in', chords: 'Your own', style: card + 'background: transparent; border: 1px dashed #5CC8B5' }
      ] };
  }
}
</script>
</body>
</html>
