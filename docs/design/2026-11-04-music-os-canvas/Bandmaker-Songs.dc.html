<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bandmaker my songs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110E}
a{color:#5CC8B5}a:hover{color:#8EE0D1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #F5EEE4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 20px 22px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; background: #1F1A15; border: 1px solid #3A3028; color: #F5EEE4; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">My songs</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
      <a href="Bandmaker-Foundation.dc.html" style="text-decoration: none; color: #F5EEE4; padding: 14px; border-radius: 18px; border: 1px solid #3A3028; background: #1F1A15; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #173A34; color: #5CC8B5; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px">{{p.key}}</div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 13px; color: #B5A796">{{p.meta}}</span>
          </div>
          <span style="font-size: 12px; color: #B5A796">{{p.when}}</span>
        </div>
        <div style="display: flex; gap: 6px">
          <sc-for list="{{p.members}}" as="m" hint-placeholder-count="5">
            <span style="{{m.style}}">{{m.short}}</span>
          </sc-for>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Vo', 'Dr', 'Rh', 'Ba', 'Ld'];
    const chips = (done) => names.map((s, i) => ({ short: s,
      style: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: Bricolage Grotesque, sans-serif; font-weight: 800; font-size: 12px; ' +
        (done[i] ? 'background: #173A34; color: #5CC8B5; border: 1px solid #5CC8B5' : 'background: transparent; color: #8A7D6E; border: 1px dashed #5E5246') }));
    return { projects: [
      { key: 'G', name: 'Untitled in G', meta: 'Verse + chorus · 96 BPM', when: 'Today', members: chips([0, 1, 1, 1, 0]) },
      { key: 'Em', name: 'Sunday idea', meta: '8 bars · 72 BPM', when: 'Sun', members: chips([0, 0, 1, 0, 0]) },
      { key: 'E5', name: 'Heavy one', meta: 'Power chords · 140 BPM', when: '2 Nov', members: chips([0, 1, 1, 0, 1]) }
    ] };
  }
}
</script>
</body>
</html>
