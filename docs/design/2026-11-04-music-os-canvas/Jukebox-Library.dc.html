<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jukebox library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14110E}
a{color:#F2A93B}a:hover{color:#FFC56B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14110E; color: #F5EEE4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1A15; border: 1px solid #3A3028; color: #F5EEE4; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F2A93B">Jukebox</div>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #F2A93B; color: #1A1208; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
        Surprise me
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #1F1A15; border: 1px solid #3A3028; color: #B5A796">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search songs or artists</span>
      <input type="search" placeholder="Search songs or artists" style="flex: 1; background: transparent; border: 0; color: #F5EEE4; font-family: Inter, sans-serif; font-size: 16px; outline: none">
    </label>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="3">
        <button style="{{g.style}}">{{g.label}}</button>
      </sc-for>
      <div style="flex: 1"></div>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #3A3028; background: transparent; color: #B5A796; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500">My level: 2</button>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 6px 0 20px">
    <sc-for list="{{shelves}}" as="shelf" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="padding: 0 20px; display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">{{shelf.title}}</h2>
          <span style="font-size: 13px; color: #B5A796">{{shelf.note}}</span>
        </div>
        <div style="display: flex; gap: 10px; padding: 0 20px; overflow: hidden">
          <sc-for list="{{shelf.songs}}" as="s" hint-placeholder-count="3">
            <a href="Jukebox-Play.dc.html" style="flex: 0 0 148px; text-decoration: none; color: #F5EEE4; background: #1F1A15; border: 1px solid #3A3028; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
              <div style="{{s.artStyle}}">
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #1A1208">{{s.initial}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</div>
                <div style="font-size: 13px; color: #B5A796; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.artist}}</div>
              </div>
              <div style="display: flex; gap: 4px; flex-wrap: wrap">
                <sc-for list="{{s.shapes}}" as="c" hint-placeholder-count="3">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #2A231C; color: #F2A93B">{{c}}</span>
                </sc-for>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: #F5EEE4; color: #14110E; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600';
    const off = 'height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid #3A3028; background: transparent; color: #F5EEE4; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500';
    const tints = ['#F2A93B', '#E9875B', '#D9B56A', '#C9925A'];
    const song = (title, artist, shapes, i) => ({ title, artist, shapes, initial: title.charAt(0),
      artStyle: 'height: 84px; border-radius: 12px; background: ' + tints[i % 4] + '; display: flex; align-items: flex-end; padding: 8px 10px' });
    return {
      genres: [{ label: 'All', style: on }, { label: 'Rock', style: off }, { label: 'Pop', style: off }],
      shelves: [
        { title: 'Your favourites', note: '2 songs', songs: [
          song('Wild Thing', 'The Troggs', ['A', 'D', 'E'], 0),
          song('Zombie', 'The Cranberries', ['Em', 'G', 'C', 'D'], 1) ] },
        { title: 'Easy to jump into', note: 'Few changes', songs: [
          song('Three Little Birds', 'Bob Marley & The Wailers', ['A', 'D', 'E'], 2),
          song('Lightning Bolt', 'Jake Bugg', ['D', 'G'], 3),
          song('What I Got', 'Sublime', ['D', 'G'], 0) ] },
        { title: 'Campfire open chords', note: 'Level 2 to 3', songs: [
          song('Yellow', 'Coldplay', ['G', 'C', 'D'], 1),
          song('Budapest', 'George Ezra', ['D', 'G', 'A'], 2),
          song('Knockin’ on Heaven’s Door', 'Bob Dylan', ['G', 'D', 'Am', 'C'], 3) ] }
      ]
    };
  }
}
</script>
</body>
</html>
